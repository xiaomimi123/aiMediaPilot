[supervisord]
nodaemon=true
user=root

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chromium]
; Chromium 148+ ignores --remote-debugging-address=0.0.0.0 and binds to
; 127.0.0.1 only (security policy). We let Chrome bind to internal port 9221
; and use socat to expose it on 0.0.0.0:9222 for Playwright on host.
command=/usr/bin/chromium
    --remote-debugging-port=9221
    --remote-allow-origins=*
    --no-sandbox
    --disable-gpu
    --disable-dev-shm-usage
    --disable-blink-features=AutomationControlled
    --window-size=%(ENV_SCREEN_WIDTH)s,%(ENV_SCREEN_HEIGHT)s
    --user-data-dir=/profiles/default
environment=DISPLAY=":99"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cdp-bridge]
; Bridge 0.0.0.0:9222 → 127.0.0.1:9221 (where Chrome listens).
; Start delayed (5s) to let Chrome bind first.
command=/bin/sh -c "sleep 5 && exec /usr/bin/socat -d TCP-LISTEN:9222,bind=0.0.0.0,fork,reuseaddr,backlog=64 TCP:127.0.0.1:9221"
autorestart=true
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -nopw -forever -shared -rfbport 5900 -quiet
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
