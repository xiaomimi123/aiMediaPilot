[supervisord]
nodaemon=true
user=root

[program:cloakserve]
; CloakBrowser CDP multiplexer — 58 C++ source-level fingerprint patches.
; Headless mode: --headless=new --ozone-platform=headless avoids X server dep.
command=/usr/local/bin/cloakserve --port=9222 --headless=new --ozone-platform=headless
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
